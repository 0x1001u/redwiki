version: '3.8'

services:
  # PostgreSQL - Document Storage
  postgres:
    image: postgres:15-alpine
    container_name: agent-wiki-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentwiki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentwiki_secret}
      POSTGRES_DB: ${POSTGRES_DB:-agent_wiki_kb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentwiki}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-wiki-network

  # Qdrant - Vector Database
  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: agent-wiki-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-wiki-network

  # Neo4j - Graph Database
  neo4j:
    image: neo4j:5.15-community
    container_name: agent-wiki-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/agentwiki_secret}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-wiki-network

  # Elasticsearch - Full-text Search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: agent-wiki-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-wiki-network

  # Redis - Caching & Message Queue
  redis:
    image: redis:7-alpine
    container_name: agent-wiki-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-wiki-network

  # Celery Worker
  celery-worker:
    build: .
    container_name: agent-wiki-celery-worker
    command: celery -A src.core.celery_app worker --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-agentwiki}:${POSTGRES_PASSWORD:-agentwiki_secret}@postgres:5432/${POSTGRES_DB:-agent_wiki_kb}
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URI=bolt://neo4j:7687
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - agent-wiki-network

  # FastAPI Application
  api:
    build: .
    container_name: agent-wiki-api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-agentwiki}:${POSTGRES_PASSWORD:-agentwiki_secret}@postgres:5432/${POSTGRES_DB:-agent_wiki_kb}
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URI=bolt://neo4j:7687
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ENVIRONMENT=development
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - agent-wiki-network

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
  elasticsearch_data:
  redis_data:

networks:
  agent-wiki-network:
    driver: bridge
